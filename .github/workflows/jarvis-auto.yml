
name: JARVIS Automatik

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8,12,16,20 * * *"

permissions:
  contents: read

jobs:
  jarvis:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Produktsuche starten
        run: python jarvis.py
