
name: JARVIS Automatik

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8,12,16,20 * * *"

permissions:
  contents: read

jobs:
  jarvis:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Produktkandidaten berechnen
        run: python jarvis.py

      - name: Kandidatenliste speichern
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-produktkandidaten
          path: kandidaten.csv
          if-no-files-found: error
          retention-days: 7
